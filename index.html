        html,body,#root{min-height:100%;margin:0}body{background:#b18468}
        .cover-boot-pre{position:relative;box-sizing:border-box;width:100%;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden;background:#b18468}
        .cover-boot-pre .cover-host{position:relative;width:100%;height:100%;overflow:hidden}
        .cover-boot-pre .cover-stage{position:absolute;width:850px;transform-origin:top left;isolation:isolate}
        .cover-boot-pre [data-cover-part]{position:absolute;max-width:none;pointer-events:none}
        .cover-boot-start{position:absolute;left:166px;display:flex;align-items:center;justify-content:center;gap:22px;width:517px;height:138px;padding:0;border:0;background:none;color:#fff5d9;font:900 67px/1 "Home Serif",serif;letter-spacing:3px;white-space:nowrap;cursor:pointer}
        .cover-boot-start img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
        .cover-boot-start span,.cover-boot-start b{position:relative;pointer-events:none}
        .cover-boot-start span{transform:translateY(-2px)}.cover-boot-start b{font:700 75px/1 serif;transform:translateY(-5px)}
        .cover-boot-start:disabled{cursor:progress}.cover-boot-start:disabled span{font-size:48px}
        .cover-boot-start:focus-visible{outline:5px solid #eab657;outline-offset:5px}
        .cover-boot-pre .cover-stage button{border:0;background:none;box-shadow:none;cursor:pointer;font-family:"Home Serif",serif;line-height:1;color:#203340;white-space:nowrap;-webkit-tap-highlight-color:transparent}
        .cover-boot-pre .cover-stage button:focus-visible,.cover-boot-pre .cover-boot-music:focus-visible{outline:5px solid #eab657;outline-offset:5px}
        .cover-boot-pre .cover-stage button[data-pending="true"]{filter:brightness(.88)}
        .cover-boot-pre .cover-stage .cover-boot-start{color:#fff5d9}
        .cover-boot-load{position:absolute;left:249px;width:354px;display:flex;align-items:center;justify-content:center;padding:0}
        .cover-boot-load-visual{position:absolute;left:0;right:0;height:88px;display:flex;align-items:center;justify-content:center;pointer-events:none}
        .cover-boot-load-visual img{position:absolute;inset:0;width:100%;height:100%}
        .cover-boot-load-visual span{position:relative;font-size:39px;font-weight:700;letter-spacing:4px}
        .cover-boot-small{position:absolute;display:flex;align-items:center;padding:0;font-size:27px;font-weight:600}
        .cover-boot-settings{left:253px;width:93px}.cover-boot-handbook{left:438px;width:167px}

        .cover-boot-handbook img{width:38px;height:35px}
        .cover-boot-divider{position:absolute;left:393px;width:2px;height:30px;background:#334449}
        .cover-boot-music{position:absolute;z-index:2;top:9px;right:9px;display:grid;place-items:center;width:48px;height:48px;padding:0;border:0;background:none;color:#173954;cursor:pointer}
